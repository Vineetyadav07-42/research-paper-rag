name: Deploy RAG Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: research-paper-rag
      ECR_REGISTRY: 643220020834.dkr.ecr.ap-south-1.amazonaws.com
      IMAGE_NAME: research-paper-rag

    steps:

      # 1. Get the repository code
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .


      # 5. Push image to ECR
      - name: Push image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest


      # 6. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Logging into ECR..."

            aws ecr get-login-password \
              --region ap-south-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              643220020834.dkr.ecr.ap-south-1.amazonaws.com

            echo "Pulling latest image..."

            docker pull \
              643220020834.dkr.ecr.ap-south-1.amazonaws.com/research-paper-rag:latest

            echo "Stopping old container..."

            docker stop research-paper-rag || true

            echo "Removing old container..."

            docker rm research-paper-rag || true

            echo "Starting new container..."

            docker run -d \
              --name research-paper-rag \
              -p 8000:8000 \
              --restart unless-stopped \
              643220020834.dkr.ecr.ap-south-1.amazonaws.com/research-paper-rag:latest

            echo "Checking container..."

            sleep 10

            docker ps

            echo "Deployment completed."